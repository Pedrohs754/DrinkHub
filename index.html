<style>html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}.chip{min-height:40px}.card{min-height:56px}nav button{min-height:52px}.item input{width:24px;height:24px}.back{min-height:44px}</style>
<style>
:root{--bg:#fbf7f2;--card:#fff;--tx:#2a2220;--mu:#7a6e69;--ac:#e0542f;--ac2:#fde6dd;--bd:#eadfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1614;--card:#272120;--tx:#f4ece7;--mu:#a89b94;--ac:#ff7a55;--ac2:#3b2a24;--bd:#3a302d}}
:root[data-theme="dark"]{--bg:#1b1614;--card:#272120;--tx:#f4ece7;--mu:#a89b94;--ac:#ff7a55;--ac2:#3b2a24;--bd:#3a302d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin-inline:auto;padding-bottom:70px}
header{padding:16px 16px 4px}
h1{margin:0;font-size:24px}
.sub{color:var(--mu);font-size:13px}
input[type=search]{width:100%;margin:10px 0 0;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0 6px}
.lbl{font-size:12px;color:var(--mu);padding:4px 16px 2px;text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.list{padding:8px 16px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;width:100%}
.card b{font-size:17px;display:block}
.meta{color:var(--mu);font-size:13px;margin-top:3px}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:8px;padding:1px 8px;font-size:12px;margin:6px 4px 0 0}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
.det{padding:12px 16px}
.back{background:none;border:0;color:var(--ac);font-size:16px;padding:6px 0;cursor:pointer}
.det h2{margin:6px 0 2px;font-size:26px}
.det h3{margin:20px 0 6px;font-size:16px}
.det ol,.det ul{padding-left:22px;margin:0}
.det li{margin:6px 0}
.btn{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.item.done span{text-decoration:line-through;color:var(--mu)}
.item span{flex:1}
.item input{width:20px;height:20px;accent-color:var(--ac)}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;max-width:640px;margin:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px;border:0;background:none;color:var(--mu);font-size:15px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
.clr{background:none;border:0;color:var(--ac);font-size:14px;padding:8px 16px;cursor:pointer}
</style>
</head>

].forEach(A2);
const F=[["Morango","6 morangos"],["Abacaxi","2 fatias de abacaxi"],["Maracujá","1 maracujá"],["Kiwi","2 kiwis"],["Manga","1/2 manga"],["Uva","10 uvas"],["Laranja","1/2 laranja"],["Melancia","150 g de melancia"],["Pêssego","1 pêssego"],["Goiaba","1 goiaba"],["Caju","2 cajus"],["Tangerina","1 tangerina"],["Acerola","10 acerolas"],["Framboesa","10 framboesas"],["Banana","1 banana"],["Melão","150 g de melão"],["Pera","1 pera"],["Coco","100 ml de água de coco"],["Limão","1 limão"],["Lichia","6 lichias"]];
F.forEach(([f,q])=>{const l=f=="Limão"?[]:["1/2 limão"],lf=f.toLowerCase();
[["Caipirinha","Cachaça","cachaça"],["Caipiroska","Vodka","vodka"],["Sakerinha","Saquê","saquê"],["Caipirissima","Rum","rum branco"]].forEach(([n,b,a])=>add(`${n} de ${f}`,b,1,[f],[q,...l,"2 colheres de açúcar",`50 ml de ${a}`,"Gelo"],["Corte as frutas em pedaços.","Macere com o açúcar no copo.",`Adicione ${a=="saquê"?"o saquê":a=="rum branco"?"o rum":"a "+a} e bastante gelo.`,"Misture bem."]));
add(`Batida de ${f}`,"Cachaça",1,[f],[q,"50 ml de cachaça","50 ml de leite condensado","Gelo"],["Bata tudo no liquidificador com gelo.","Sirva gelada."]);
add(`Mojito de ${f}`,"Rum",1,[f,"Hortelã"],[q,"50 ml de rum branco","10 folhas de hortelã",...l,"2 colheres de açúcar","Água com gás","Gelo"],["Macere a fruta com a hortelã, o limão e o açúcar.","Adicione o rum e o gelo.","Complete com água com gás.","Misture com delicadeza."]);
add(`Daiquiri de ${f}`,"Rum",1,[f],[q,"50 ml de rum branco","25 ml de suco de limão","2 colheres de açúcar","Gelo"],["Bata tudo no liquidificador com gelo.","Sirva numa taça."]);
add(`Margarita de ${f}`,"Tequila",1,[f],[q,"50 ml de tequila","25 ml de licor de laranja","25 ml de suco de limão","Sal para a borda","Gelo"],["Bata tudo no liquidificador com gelo.","Sirva numa taça com borda de sal."]);
add(`Gin Tônica de ${f}`,"Gin",1,[f],["50 ml de gin","150 ml de água tônica",`${f} (para decorar)`,"Gelo"],["Encha uma taça com gelo.","Adicione o gin e a fruta.","Complete com a tônica devagar."]);
add(`Vodka com suco de ${f}`,"Vodka",1,[f],["50 ml de vodka",`100 ml de suco de ${lf}`,"Gelo"],["Coloque gelo no copo alto.","Adicione a vodka.","Complete com o suco e misture."]);
if(f!="Limão")add(`Limonada de ${f}`,"Sem álcool",0,[f,"Limão"],[q,"2 limões","3 colheres de açúcar","200 ml de água","Gelo"],["Bata tudo no liquidificador.","Sirva com gelo."]);
add(`Smoothie de ${f}`,"Sem álcool",0,[f],[q,"100 ml de leite ou iogurte","1 colher de mel","Gelo"],["Bata tudo no liquidificador até ficar cremoso.","Sirva gelado."]);
add(`Mojito de ${f} sem álcool`,"Sem álcool",0,[f,"Hortelã"],[q,"10 folhas de hortelã",...l,"2 colheres de açúcar","Água com gás","Gelo"],["Macere a fruta com a hortelã, o limão e o açúcar.","Adicione gelo.","Complete com água com gás e misture."]);
add(`Caipifruta de ${f}`,"Sem álcool",0,[f],[q,...l,"2 colheres de açúcar","Água com gás ou Sprite","Gelo"],["Corte as frutas em pedaços.","Macere com o açúcar no copo.","Adicione gelo e complete com água com gás.","Misture bem."]);
add(`Soda italiana de ${f}`,"Sem álcool",0,[f],[`30 ml de xarope de ${lf}`,"150 ml de água com gás","1 fatia de limão","Gelo"],["Coloque gelo e o xarope no copo.","Complete com água com gás e misture."]);
});
F.forEach(([f,q])=>{
add(`Cooler de ${f} e Gengibre`,"Vodka",1,["Autoral",f,"Gengibre"],["50 ml de vodka",q,"2 fatias de gengibre","15 ml de suco de limão","Ginger beer","Gelo"],["Macere a fruta com o gengibre no copo.","Adicione o limão, a vodka e o gelo.","Complete com ginger beer e misture."]);
add(`Gin Sour de ${f}`,"Gin",1,["Autoral",f],["50 ml de gin",q,"25 ml de suco de limão","15 ml de xarope de açúcar","Gelo"],["Bata tudo na coqueteleira com gelo.","Coe num copo baixo com gelo."]);
add(`Fizz de ${f} e Manjericão`,"Sem álcool",0,["Autoral",f,"Manjericão"],[q,"5 folhas de manjericão","15 ml de suco de limão","1 colher de açúcar","Água com gás","Gelo"],["Macere a fruta com o manjericão e o açúcar no copo.","Adicione o limão e o gelo.","Complete com água com gás e misture."]);
});
const BASES=["Todos","Sem álcool","Vodka","Gin","Rum","Tequila","Cachaça","Whisky","Saquê","Cerveja","Vinho","Espumante","Outros"];
const UTL=["Todos","Liquidificador","Coqueteleira","Coador","Socador (pilão)","Dosador (jigger)","Faca e tábua","Colher bailarina","Taça","Caneca de cobre","Copo baixo","Copo alto","Copão","Copo de shot","Xícara","Panela","Forma de gelo"];
function ut(d){const s=d[5].join(" ").toLowerCase(),i=d[4].join(" ").toLowerCase(),u=[];
if(/liquidificador/.test(s))u.push("Liquidificador");
if(/coqueteleira/.test(s))u.push("Coqueteleira");
if(/coe /.test(s))u.push("Coador");
if(/macere/.test(s))u.push("Socador (pilão)");
if(/\d+ ?ml/.test(i))u.push("Dosador (jigger)");
if(/corte|casca|rodela|fatia|esprema/.test(s+i))u.push("Faca e tábua");
if(/misture|mexa|complete/.test(s))u.push("Colher bailarina");
if(/xícara/.test(s))u.push("Xícara");else if(/copo de shot|copos de shot/.test(s))u.push("Copo de shot");else if(/taça/.test(s))u.push("Taça");else if(/caneca/.test(s))u.push("Caneca de cobre");else if(/copo baixo/.test(s))u.push("Copo baixo");else if(d[3].includes("Copão"))u.push("Copão");else if(!d[3].includes("Gelo saborizado"))u.push("Copo alto");
if(/forma de gelo/.test(s))u.push("Forma de gelo");if(/panela/.test(s))u.push("Panela");return u}
const INGS=["Todos",...[...new Set(D.flatMap(d=>d[3]))].sort((a,b)=>a.localeCompare(b,"pt"))];
let base="Todos",ing="Todos",ute="Todos",q="",tab=1,open=-1,shop=[];
try{shop=JSON.parse(localStorage.getItem("shop")||"[]")}catch(e){}
function save(){try{localStorage.setItem("shop",JSON.stringify(shop))}catch(e){}}
const $=s=>document.querySelector(s),A=$("#app");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function chips(arr,cur,k){return arr.map(x=>`<button class="chip${x===cur?" on":""}" data-k="${k}" data-v="${x}">${x}</button>`).join("")}
function render(){
  $("#t1").className=tab==1?"on":"";$("#t2").className=tab==2?"on":"";
  $("#t2").textContent="🛒 Lista de compras"+(shop.length?` (${shop.length})`:"");
  if(tab==2)return renderShop();
  if(open>=0)return renderDet();
  const n=q.trim().toLowerCase();
  const r=D.map((d,i)=>[d,i]).filter(([d])=>(base=="Todos"||(base=="Sem álcool"?!d[2]:d[1]==base))&&(ing=="Todos"||d[3].includes(ing))&&(ute=="Todos"||ut(d).includes(ute))&&(!n||d[0].toLowerCase().includes(n)));
  A.innerHTML=`<header><h1>🍹 DrinkHub</h1><div class="sub">${r.length} drink${r.length==1?"":"s"}</div><input type="search" id="s" placeholder="Buscar drink…" value="${esc(q)}"></header>
  <div class="bar"><div class="lbl">Base</div><div class="row">${chips(BASES,base,"b")}</div><div class="lbl">Ingrediente ou tipo</div><div class="row">${chips(INGS,ing,"i")}</div><div class="lbl">Utensílio</div><div class="row">${chips(UTL,ute,"u")}</div></div>
  <div class="list">${r.length?r.map(([d,i])=>`<button class="card" data-o="${i}"><b>${d[0]}</b><div class="meta">${d[2]?d[1]:"Sem álcool"}</div>${d[3].map(t=>`<span class="tag">${t}</span>`).join("")}</button>`).join(""):'<div class="empty">Nenhum drink com esses filtros.</div>'}</div>`;
  const s=$("#s");s.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const t=$("#s");t.focus();t.setSelectionRange(p,p)};
}
function renderDet(){
  const d=D[open];
  A.innerHTML=`<div class="det"><button class="back" id="bk">← Voltar</button><h2>${d[0]}</h2><div class="meta">${d[2]?d[1]:"Sem álcool"}</div>
  <h3>Ingredientes</h3><ul>${d[4].map(x=>`<li>${x}</li>`).join("")}</ul>
  <h3>Utensílios</h3><ul>${ut(d).map(x=>`<li>${x}</li>`).join("")}</ul><h3>Modo de preparo</h3><ol>${d[5].map(x=>`<li>${x}</li>`).join("")}</ol>
  <button class="btn" id="add">🛒 Adicionar à lista de compras</button></div>`;
  $("#bk").onclick=()=>{if(nav)history.back();else location.hash="inicio"};
  $("#add").onclick=()=>{[...d[4],...ut(d).map(x=>"🧰 "+x)].forEach(t=>{if(!shop.some(s=>s.t==t))shop.push({t,d:0})});save();$("#add").textContent="✓ Adicionado!";$("#t2").textContent="🛒 Lista de compras ("+shop.length+")"};
}
function renderShop(){
  A.innerHTML=`<header><h1>🛒 Lista de compras</h1><div class="sub">${shop.length} ite${shop.length==1?"m":"ns"}</div></header><div class="list">${shop.length?[0,1].map(g=>{const r=shop.map((s,i)=>[s,i]).filter(([s])=>(s.t.startsWith("🧰 ")?1:0)==g);return r.length?`<div class="lbl">${g?"🧰 Utensílios":"🛒 Ingredientes"} (${r.length})</div>`+r.map(([s,i])=>`<div class="item${s.d?" done":""}"><input type="checkbox" data-c="${i}"${s.d?" checked":""}><span>${esc(s.t)}</span><button class="x" data-x="${i}">✕</button></div>`).join(""):""}).join(""):'<div class="empty">Sua lista está vazia. Abra um drink e toque em “Adicionar à lista de compras”.</div>'}</div>${shop.length?'<button class="clr" id="cl">Limpar tudo</button>':""}`;
  const c=$("#cl");if(c)c.onclick=()=>{shop=[];save();render()};
}
A.onclick=e=>{
  const b=e.target.closest("[data-k]"),o=e.target.closest("[data-o]"),x=e.target.closest("[data-x]");
  if(b){const k=b.dataset.k,v=b.dataset.v;if(k=="b")base=v;else if(k=="u")ute=v;else ing=v;render()}
  else if(o){nav=1;location.hash="drink-"+o.dataset.o}
  else if(x){shop.splice(+x.dataset.x,1);save();render()}
};
A.onchange=e=>{const c=e.target.dataset.c;if(c!==undefined){shop[+c].d=e.target.checked?1:0;save();render()}};
$("#t1").onclick=()=>{location.hash="inicio"};
$("#t2").onclick=()=>{location.hash="lista"};
let nav=0;
function route(){const h=location.hash.slice(1);if(h=="lista"){tab=2;open=-1}else if(/^drink-\d+$/.test(h)&&D[+h.slice(6)]){tab=1;open=+h.slice(6);scrollTo(0,0)}else{tab=1;open=-1}render()}
addEventListener("hashchange",route);route();
render();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
